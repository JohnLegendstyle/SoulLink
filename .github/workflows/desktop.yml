name: Desktop Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml', 'LICENSE', 'SPIELSTART.md', 'THIRD_PARTY_NOTICES.md']
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: SoulLink-macOS
          - os: windows-2022
            artifact: SoulLink-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python prepare_runtime.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-build.txt
      - run: pyinstaller --clean --noconfirm SoulLink.spec
      - run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/release/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'spielabend' }}
          name: Soul Link – Optimus und Bee
          body: 'ZIP vollständig entpacken, SoulLink starten, eigene deutsche SoulSilver-ROM auswählen. Emulator und Java sind enthalten. Hinweise in SPIELSTART.md beachten.'
          files: artifacts/**/*.zip
