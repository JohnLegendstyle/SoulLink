<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulLink · Anmelden</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101214;color:#edf0f3;font:16px system-ui,sans-serif;padding:24px}main{max-width:410px;width:100%;padding:36px;background:#191c20;border:1px solid #343a40;border-radius:24px}h1{letter-spacing:-1px;margin:0 0 12px}h1 span{color:#e7b85d}p{color:#a7afb8;line-height:1.6}label{display:block;font-size:14px;margin-top:22px}select,input,button{width:100%;padding:13px;margin-top:9px;border-radius:10px;border:1px solid #49515a;background:#242a30;color:#f2f4f5;font:inherit}button{background:#e7b85d;color:#16191b;border:0;font-weight:700;margin-top:28px;cursor:pointer}button:disabled{opacity:.6}#error{color:#ffb0a9;font-size:14px}small{display:block;color:#7f8995;margin-top:22px;line-height:1.5}</style>
<main><h1>SOUL<span>LINK</span></h1><p>Eure private Spielrunde.<br>Bitte anmelden, um Teams und Spielbilder zu sehen.</p><form id="login"><label for="username">Anmeldename</label><select id="username" autocomplete="username"><option>John</option><option>Eddie</option></select><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button id="submit">Anmelden</button><p id="error" role="alert"></p></form><small>Private Verbindung · kein öffentlicher Zugriff auf eure Bildschirme</small></main>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit'),error=document.querySelector('#error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);localStorage.removeItem('soullink-access');location.reload();}catch(e){error.textContent=e.message;}finally{b.disabled=false;}});</script></html>
